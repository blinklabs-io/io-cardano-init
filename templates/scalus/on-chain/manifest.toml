[manifest]
summary = "Scalus on-chain project: a gift-card one-shot minting policy and its redeem spending validator in Scala 3 (Plutus V3), compiled to UPLC, writing a CIP-57 blueprint to ../blueprint/plutus.json"

[[files]]
source = "Justfile.jinja"
dest = "Justfile"

[[files]]
source = "build.sbt.jinja"
dest = "build.sbt"

[[files]]
source = ".gitignore"
dest = ".gitignore"

[[files]]
source = "project/plugins.sbt"
dest = "project/plugins.sbt"

[[files]]
source = "project/build.properties"
dest = "project/build.properties"

[[files]]
source = "src/main/scala/app/GiftCard.scala"
dest = "src/main/scala/app/GiftCard.scala"

[[files]]
source = "src/main/scala/app/GiftCardContract.scala"
dest = "src/main/scala/app/GiftCardContract.scala"

[[files]]
source = "src/main/scala/app/Main.scala"
dest = "src/main/scala/app/Main.scala"

[[files]]
source = "src/test/scala/app/GiftCardTest.scala"
dest = "src/test/scala/app/GiftCardTest.scala"
